      '<div id="adjPreview" style="font-size:12.5px;color:var(--muted);margin-bottom:16px;min-height:18px"></div>' +
      '<div class="sheet-actions"><button class="btn save-btn" id="adjSaveBtn">Guardar</button></div>';

    document.getElementById("modal").classList.remove("hidden");

    function updatePreview() {
      var adj = parseAmount(document.getElementById("adjAmount").value);
      var prev = document.getElementById("adjPreview");
      if (isNaN(adj) || adj <= 0) { prev.textContent = ""; return; }
      var nuevo = tipo === "pagar" ? (deuda.amount - adj) : (deuda.amount + adj);
      if (nuevo <= 0) {
        prev.innerHTML = 'Quedará en <b style="color:var(--income)">0 € (liquidada)</b>';
      } else {
        prev.innerHTML = 'Quedará en <b>' + eur(Math.round(nuevo * 100) / 100) + '</b>';
      }
    }

    document.getElementById("adjustToggle").addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-tipo]");
      if (!b) return;
      tipo = b.getAttribute("data-tipo");
      this.querySelector('[data-tipo="pagar"]').className = tipo === "pagar" ? "on-ingreso" : "";
      this.querySelector('[data-tipo="anadir"]').className = tipo === "anadir" ? "on-gasto" : "";
      updatePreview();
    });

    document.getElementById("adjAmount").addEventListener("input", updatePreview);

    document.getElementById("adjSaveBtn").addEventListener("click", function () {
      var adj = parseAmount(document.getElementById("adjAmount").value);
      if (isNaN(adj) || adj <= 0) { toast("Pon un importe válido"); document.getElementById("adjAmount").focus(); return; }
      var antesAmount = deuda.amount, antesSettled = deuda.settled;
      var nuevo = tipo === "pagar" ? (deuda.amount - adj) : (deuda.amount + adj);
      var liquidada = nuevo <= 0;
      if (liquidada) { deuda.amount = 0; deuda.settled = true; }
      else { deuda.amount = Math.round(nuevo * 100) / 100; }
      closeModal();
      render();
      saveDebt(deuda).then(function (ok) {
        if (ok) { toast(liquidada ? "Deuda liquidada ✓" : "Deuda actualizada ✓"); return; }
        deuda.amount = antesAmount; deuda.settled = antesSettled;
        render();
        avisoFallo("actualizar la deuda");
      });
    });

    setTimeout(function () { var a = document.getElementById("adjAmount"); if (a) a.focus(); }, 250);
  }

  // ---------- Gastos fijos: solo previsión ----------
  // Empareja cada cuota fija con un movimiento real del mes que se está viendo.
  // Se compara por importe (las cuotas suelen tener importes distintivos) y se
  // va "consumiendo" cada movimiento, para que dos cuotas del mismo importe no
  // se emparejen las dos con el mismo cargo.
  function estadoFijos() {
    var delMes = monthGastos();
    var usados = {};
    var lista = fijos.filter(function (f) { return f.activo; }).map(function (f) {
      var mov = null;
      for (var i = 0; i < delMes.length; i++) {
        if (usados[delMes[i].id]) continue;
        if (Math.abs(delMes[i].amount - f.amount) < 0.005) { mov = delMes[i]; break; }
      }
      if (mov) usados[mov.id] = true;
      return { fijo: f, cobrado: !!mov, faltan: diasHastaCuota(f.dia) };
    });
    var total = 0, cobrado = 0;
    lista.forEach(function (x) { total += x.fijo.amount; if (x.cobrado) cobrado += x.fijo.amount; });
    return { lista: lista, total: total, cobrado: cobrado, pendiente: total - cobrado };
  }

  // Días que faltan para que se cobre una cuota. Devuelve null si no tiene día
  // puesto, si ya pasó, o si estás mirando un mes que no es el actual (ahí un
  // "en 3 días" no significaría nada).
  function diasHastaCuota(dia) {
    if (dia == null) return null;
    var hoy = new Date();
    if (viewYear !== hoy.getFullYear() || viewMonth !== hoy.getMonth()) return null;
    var diasDelMes = new Date(viewYear, viewMonth + 1, 0).getDate();
    var d = Math.min(dia, diasDelMes);   // si la cuota es el 31 y el mes tiene 30
    var faltan = d - hoy.getDate();
    return faltan < 0 ? null : faltan;
  }

  function textoCuando(faltan) {
    if (faltan == null) return "";
    if (faltan === 0) return "hoy";
    if (faltan === 1) return "mañana";
    return "en " + faltan + " días";
  }

  // Tarjeta que se pinta en Resumen
  function tarjetaFijos() {
    var est = estadoFijos();
    if (est.lista.length === 0) return "";
    var pct = est.total > 0 ? (est.cobrado / est.total * 100) : 0;
    var quedaTrasFijos = sum(monthIngresos()) - sum(monthGastos()) - est.pendiente;

    // Las pendientes se ordenan por lo que falta para el cobro: primero las que
    // están al caer, y al final las que no tienen día puesto.
    var pendientes = est.lista.filter(function (x) { return !x.cobrado; })
      .sort(function (a, b) {
        if (a.faltan == null && b.faltan == null) return 0;
        if (a.faltan == null) return 1;
        if (b.faltan == null) return -1;
        return a.faltan - b.faltan;
      });

    var prontas = pendientes.filter(function (x) { return x.faltan != null && x.faltan <= 7; });
    var totalPronto = prontas.reduce(function (a, x) { return a + x.fijo.amount; }, 0);

    var listaPend = pendientes.length === 0
      ? '<div style="font-size:12.5px;color:var(--income);margin-top:10px">✓ Ya han pasado todas las cuotas de este mes.</div>'
      : '<div style="margin-top:11px;border-top:1px solid var(--line);padding-top:9px">' +
        pendientes.map(function (x) {
          var c = cat(x.fijo.categoryId);
          var pronto = x.faltan != null && x.faltan <= 7;
          var cuando = textoCuando(x.faltan);
          return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px">' +
            '<span>' + c.emoji + '</span>' +
            '<span style="flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
            esc(x.fijo.concepto || c.label) + (x.fijo.dia ? ' · día ' + x.fijo.dia : '') + '</span>' +
            (cuando
              ? '<span class="pill-pronto' + (x.faltan <= 1 ? ' urgente' : '') + '">' + cuando + '</span>'
              : '') +
            '<span style="font-weight:600;font-variant-numeric:tabular-nums">' + eur(x.fijo.amount) + '</span></div>';
        }).join("") + '</div>';

    var avisoPronto = prontas.length
      ? '<div style="margin-top:11px;background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--ink);line-height:1.45">' +
        '⏰ <b>' + eur(totalPronto) + '</b> en los próximos 7 días' +
        (prontas.length === 1 ? ' (' + esc(prontas[0].fijo.concepto || cat(prontas[0].fijo.categoryId).label) + ')'
                              : ' en ' + prontas.length + ' cuotas') + '</div>'
      : '';

    return '<div class="card"><h3>📌 Gastos fijos del mes ' +
      '<span style="font-size:11px;font-weight:400;color:var(--faint);font-family:\'Hanken Grotesk\',sans-serif">· previsión</span></h3>' +
      '<div style="display:flex;gap:10px;margin-bottom:11px">' +
      '<div style="flex:1;background:var(--bg2);border-radius:12px;padding:10px 12px"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.04em">Total</div><div style="font-family:\'Fraunces\',serif;font-size:16px;font-weight:700">' + eurShort(est.total) + '</div></div>' +
      '<div style="flex:1;background:var(--income-soft);border-radius:12px;padding:10px 12px"><div style="font-size:10px;color:var(--income-ink);text-transform:uppercase;font-weight:700;letter-spacing:.04em">Ya pasaron</div><div style="font-family:\'Fraunces\',serif;font-size:16px;font-weight:700;color:var(--income)">' + eurShort(est.cobrado) + '</div></div>' +
      '<div style="flex:1;background:var(--expense-soft);border-radius:12px;padding:10px 12px"><div style="font-size:10px;color:var(--expense-ink);text-transform:uppercase;font-weight:700;letter-spacing:.04em">Pendiente</div><div style="font-family:\'Fraunces\',serif;font-size:16px;font-weight:700;color:var(--expense)">' + eurShort(est.pendiente) + '</div></div>' +
      '</div>' +
      '<div class="catbar-track"><div class="catbar-fill" style="width:' + pct.toFixed(1) + '%;background:var(--income)"></div></div>' +
      (est.pendiente > 0
        ? '<div style="margin-top:11px;font-size:12.5px;color:var(--muted)">Cuando pasen las cuotas que faltan te quedarían <b style="color:' + (quedaTrasFijos < 0 ? "var(--expense)" : "var(--ink)") + '">' + eur(quedaTrasFijos) + '</b></div>'
        : '') +
      avisoPronto + listaPend + '</div>';
  }

  function openFijosSheet() {
    var sheet = document.getElementById("sheet");
    var est = estadoFijos();
    var filas = fijos.length === 0
      ? '<div class="empty" style="padding:22px 6px"><div class="big">📌</div>' +
        '<p>Aún no has apuntado ninguna cuota fija.</p>' +
        '<p class="hint">Apunta lo que te cobran todos los meses: Netflix, gimnasio, préstamo, teléfono…</p></div>'
      : fijos.map(function (f) {
          var c = cat(f.categoryId);
          return '<div class="item" data-fijo-id="' + esc(f.id) + '"' + (f.activo ? '' : ' style="opacity:.5"') + '>' +
            '<div class="ico" style="background:' + c.color + '22">' + c.emoji + '</div>' +
            '<div class="mid"><div class="t">' + esc(f.concepto || c.label) + '</div>' +
            '<div class="s">' + esc(c.label) + (f.dia ? ' · día ' + f.dia : '') + (f.cuenta ? ' · ' + esc(f.cuenta) : '') + (f.activo ? '' : ' · en pausa') + '</div></div>' +
            '<div class="amt">' + eur(f.amount) + '</div>' +
            '<button class="item-del" data-del-fijo="' + esc(f.id) + '" aria-label="Borrar">🗑</button></div>';
        }).join("");

    sheet.innerHTML =
      '<div class="grab"></div>' +
      '<h2>Mis gastos fijos</h2>' +
      '<div class="cat-hint">Esto <b>no crea ningún gasto</b>: los movimientos siguen viniendo del banco. Sirve para saber cuánto del mes ya está comprometido en cuotas y cuánto te queda de verdad.</div>' +
      (fijos.length ? '<div class="rev-count">Total al mes: <b>' + eur(est.total) + '</b></div>' : '') +
      '<div id="fijosList">' + filas + '</div>' +
      '<div class="edit-hint" style="margin-top:10px">✎ Toca una cuota para editarla</div>' +
      '<div class="sheet-actions"><button class="btn save-btn" id="addFijoBtn" style="flex:1">+ Añadir cuota fija</button></div>';
    document.getElementById("modal").classList.remove("hidden");

    document.getElementById("addFijoBtn").addEventListener("click", function () { openFijoModal({}); });
    document.getElementById("fijosList").addEventListener("click", function (ev) {
      var del = ev.target.closest("[data-del-fijo]");
      if (del) {
        ev.stopPropagation();
        var idDel = del.getAttribute("data-del-fijo");
        var f = fijos.find(function (x) { return x.id === idDel; });
        if (!window.confirm("¿Borrar la cuota \"" + (f ? (f.concepto || eur(f.amount)) : "") + "\"?")) return;
        fijos = fijos.filter(function (x) { return x.id !== idDel; });
        openFijosSheet(); render();
        deleteFijo(idDel).then(function (ok) {
          if (ok) { toast("Cuota borrada"); return; }
          if (f) fijos.push(f);
          openFijosSheet(); render();
          avisoFallo("borrar la cuota");
        });
        return;
      }
      var it = ev.target.closest("[data-fijo-id]");
      if (!it) return;
      var f2 = fijos.find(function (x) { return x.id === it.getAttribute("data-fijo-id"); });
      if (f2) openFijoModal(f2);
    });
  }

  function openFijoModal(f) {
    var editando = !!f.id;
    var sheet = document.getElementById("sheet");
    sheet.innerHTML =
      '<div class="grab"></div>' +
      '<h2>' + (editando ? "Editar cuota fija" : "Nueva cuota fija") + '</h2>' +
      '<div class="field"><label>Concepto</label>' +
      '<input id="fjConcepto" class="txt-input" type="text" placeholder="p. ej. Netflix" value="' + esc(f.concepto || "") + '"></div>' +
      '<div class="field"><label>Importe al mes</label>' +
      '<div class="amount-input"><span>€</span><input id="fjAmount" type="text" inputmode="decimal" placeholder="0,00" value="' + esc(f.amount != null ? String(f.amount).replace(".", ",") : "") + '"></div></div>' +
      '<div class="field"><label>Categoría</label>' +
      '<select id="fjCat" class="txt-input">' + catOptions(f.categoryId || "suscripciones") + '</select></div>' +
      '<div class="field"><label>Día del mes <span style="font-weight:400;text-transform:none;letter-spacing:0">(opcional)</span></label>' +
      '<input id="fjDia" class="txt-input" type="number" min="1" max="31" placeholder="p. ej. 3" value="' + esc(f.dia != null ? String(f.dia) : "") + '"></div>' +
      ((perfil.cuentas && perfil.cuentas.length)
        ? '<div class="field"><label>Cuenta</label><select id="fjCuenta" class="txt-input">' + cuentaOptions(f.cuenta || "") + '</select></div>'
        : '') +
      '<div class="field"><label style="display:flex;align-items:center;gap:9px;text-transform:none;font-size:13.5px;color:var(--ink)">' +
      '<input id="fjActivo" type="checkbox" style="width:18px;height:18px;accent-color:var(--primary)"' + (f.activo === false ? '' : ' checked') + '> Contar esta cuota en la previsión</label></div>' +
      '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" id="fjBackBtn" style="flex:0 0 54px">‹</button>' +
      '<button class="btn save-btn" id="fjSaveBtn">' + (editando ? "Guardar cambios" : "Guardar cuota") + '</button>' +
      '</div>';
    document.getElementById("modal").classList.remove("hidden");

    document.getElementById("fjBackBtn").addEventListener("click", openFijosSheet);

    document.getElementById("fjSaveBtn").addEventListener("click", function () {
      var amt = parseAmount(document.getElementById("fjAmount").value);
      if (isNaN(amt) || amt <= 0) { toast("Pon un importe válido"); document.getElementById("fjAmount").focus(); return; }
      var diaTxt = document.getElementById("fjDia").value;
      var dia = diaTxt === "" ? null : Math.min(31, Math.max(1, parseInt(diaTxt, 10) || 1));
      var selCu = document.getElementById("fjCuenta");
      var nuevo = {
        id: f.id || uid(),
        concepto: document.getElementById("fjConcepto").value.trim(),
        amount: amt,
        categoryId: document.getElementById("fjCat").value,
        dia: dia,
        cuenta: selCu ? selCu.value : (f.cuenta || ""),
        activo: document.getElementById("fjActivo").checked
      };
      var copiaAnterior = editando ? fijos.find(function (x) { return x.id === f.id; }) : null;
      var antes = copiaAnterior ? JSON.parse(JSON.stringify(copiaAnterior)) : null;
      if (editando) {
        fijos = fijos.map(function (x) { return x.id === nuevo.id ? nuevo : x; });
      } else {
        fijos.push(nuevo);
      }
      openFijosSheet(); render();
      saveFijo(nuevo).then(function (ok) {
        if (ok) { toast(editando ? "Cuota actualizada ✓" : "Cuota guardada ✓"); return; }
        if (editando && antes) fijos = fijos.map(function (x) { return x.id === antes.id ? antes : x; });
        else fijos = fijos.filter(function (x) { return x.id !== nuevo.id; });
        openFijosSheet(); render();
        avisoFallo("guardar la cuota");
      });
    });

    setTimeout(function () { var c = document.getElementById("fjConcepto"); if (c && !editando) c.focus(); }, 250);
  }

  // ---------- Pendiente de cobro ----------
  // Gastos que adelantaste y te tienen que devolver. No cuentan en tus totales,
  // pero conviene tenerlos a la vista para no olvidarte de cobrarlos.
  function tarjetaPendienteCobro() {
    var lista = pendientesDeCobro();
    if (lista.length === 0) return "";
    var total = sum(lista);

    var filas = lista.map(function (e) {
      var c = cat(e.categoryId);
      return '<div class="item" data-id="' + esc(e.id) + '" style="border-style:dashed">' +
        '<div class="ico" style="background:' + c.color + '22;opacity:.65">' + c.emoji + '</div>' +
        '<div class="mid"><div class="t">' + esc(e.note || c.label) + '</div>' +
        '<div class="s">' + shortDate(e.date) + (e.cuenta ? ' · ' + esc(e.cuenta) : '') + '</div></div>' +
        '<div class="amt">' + eur(e.amount) + '</div>' +
        '<button class="debt-settle" data-cobrado-id="' + esc(e.id) + '" title="Marcar como devuelto">✓</button></div>';
    }).join("");

    return '<div class="card"><h3>💸 Pendiente de cobro ' +
      '<span style="font-size:11px;font-weight:400;color:var(--faint);font-family:\'Hanken Grotesk\',sans-serif">· ' + eur(total) + '</span></h3>' +
      '<div style="font-size:12.5px;color:var(--muted);margin-bottom:11px">Dinero que adelantaste y te tienen que devolver. No cuenta en tus gastos.</div>' +
      filas +
      '<div class="edit-hint" style="margin:10px 0 0">✓ para marcar que ya te lo han devuelto</div></div>';
  }

  // ---------- Presupuestos por categoría ----------
  function gastadoPorCategoria() {
    var m = {};
    monthGastos().forEach(function (e) { m[e.categoryId] = (m[e.categoryId] || 0) + (e.amount || 0); });
    return m;
  }

  // Tarjeta que se pinta en Resumen. Muestra TODAS las categorías con límite,
  // incluidas las que aún no tienen gasto este mes.
  function tarjetaPresupuestos() {
    var ids = Object.keys(presupuestos);
    if (ids.length === 0) return "";
    var gastado = gastadoPorCategoria();
    var totalLim = 0, totalGas = 0, nPasados = 0;

    var filas = ids.map(function (id) {
      var c = cat(id), lim = presupuestos[id], gas = gastado[id] || 0;
      totalLim += lim; totalGas += gas;
      var pct = lim > 0 ? (gas / lim * 100) : 0;
      var pasado = gas > lim;
      if (pasado) nPasados++;
      var color = pasado ? "var(--expense)" : (pct >= 80 ? "var(--warn-ink)" : "var(--income)");
      return { pct: pct, html:
        '<div style="margin-bottom:13px">' +
        '<div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:5px">' +
        '<span style="font-size:15px">' + c.emoji + '</span>' +
        '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(c.label) + '</span>' +
        '<span style="font-variant-numeric:tabular-nums;font-weight:600;color:' + color + '">' + eurShort(gas) + '</span>' +
        '<span style="font-size:11.5px;color:var(--faint)">de ' + eurShort(lim) + '</span></div>' +
        '<div class="catbar-track"><div class="catbar-fill" style="width:' + Math.min(100, pct).toFixed(1) + '%;background:' + color + '"></div></div>' +
        (pasado ? '<div style="font-size:11.5px;color:var(--expense);margin-top:4px">Te has pasado ' + eur(gas - lim) + '</div>' : '') +
        '</div>' };
    }).sort(function (a, b) { return b.pct - a.pct; }).map(function (x) { return x.html; }).join("");

    return '<div class="card"><h3>🎯 Presupuestos ' +
      '<span style="font-size:11px;font-weight:400;color:var(--faint);font-family:\'Hanken Grotesk\',sans-serif">· ' + eurShort(totalGas) + ' de ' + eurShort(totalLim) + '</span></h3>' +
      filas +
      (nPasados > 0
        ? '<div style="font-size:12.5px;color:var(--expense);border-top:1px solid var(--line);padding-top:9px">⚠ Te has pasado en ' + nPasados + (nPasados === 1 ? " categoría" : " categorías") + '</div>'
        : '') +
      '</div>';
  }

  function openPresupuestosSheet() {
    var sheet = document.getElementById("sheet");
    var gastado = gastadoPorCategoria();

    var filas = catsParaElegir(null).filter(function (c) { return c.id !== "sin_clasificar"; }).map(function (c) {
      var lim = presupuestos[c.id];
      return '<div style="display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)">' +
        '<span style="font-size:16px;width:24px;text-align:center;flex-shrink:0">' + c.emoji + '</span>' +
        '<span style="flex:1;min-width:0;font-size:13px">' + esc(c.label) +
        '<br><span style="font-size:11px;color:var(--faint)">este mes: ' + eurShort(gastado[c.id] || 0) + '</span></span>' +
        '<input class="presup-in" data-cat="' + c.id + '" type="text" inputmode="decimal" placeholder="—" ' +
        'value="' + (lim != null ? esc(String(lim).replace(".", ",")) : "") + '" ' +
        'style="width:86px;flex-shrink:0;border:1.5px solid var(--line);border-radius:9px;padding:9px;text-align:right;font-family:\'Hanken Grotesk\';font-size:13.5px;outline:none">' +
        '</div>';
    }).join("");

    sheet.innerHTML =
      '<div class="grab"></div>' +
      '<h2>Presupuestos</h2>' +
      '<div class="cat-hint">Pon un límite al mes en las categorías que quieras vigilar. En el <b>Resumen</b> verás una barra con lo que llevas y te avisará si te pasas. Deja vacías las que no te interesen.</div>' +
      '<div>' + filas + '</div>' +
      '<div class="sheet-actions"><button class="btn save-btn" id="presupSaveBtn" style="flex:1">Guardar presupuestos</button></div>';
    document.getElementById("modal").classList.remove("hidden");

    document.getElementById("presupSaveBtn").addEventListener("click", function () {
      var btn = this;
      var antes = {};
      Object.keys(presupuestos).forEach(function (k) { antes[k] = presupuestos[k]; });

      var nuevos = {}, mostradas = {};
      Array.prototype.forEach.call(document.querySelectorAll(".presup-in"), function (inp) {
        var id = inp.getAttribute("data-cat");
        mostradas[id] = true;
        var v = parseAmount(inp.value);
        if (!isNaN(v) && v > 0) nuevos[id] = v;
      });
      // Si una categoría está oculta no sale en esta pantalla; su presupuesto se
      // conserva tal cual en vez de borrarlo por no aparecer.
      Object.keys(antes).forEach(function (id) { if (!mostradas[id]) nuevos[id] = antes[id]; });

      // Guardar los que cambian y borrar los que se han dejado vacíos
      var tareas = [];
      Object.keys(mostradas).forEach(function (id) {
        var a = antes[id], b = nuevos[id];
        if (b != null && b !== a) tareas.push(savePresupuesto(id, b));
        else if (b == null && a != null) tareas.push(deletePresupuesto(id));
      });
      if (tareas.length === 0) { closeModal(); return; }

      presupuestos = nuevos;
      btn.disabled = true;
      Promise.all(tareas).then(function (res) {
        btn.disabled = false;
        if (res.every(function (r) { return r; })) { closeModal(); render(); toast("Presupuestos guardados ✓"); return; }
        presupuestos = antes;
        render();
        avisoFallo("guardar los presupuestos");
      });
    });
  }

  // ---------- Gestionar categorías ----------
  var COLORES_CAT = ["#14543C","#3A6B5A","#6F9E78","#4E8FA8","#5B6C8F","#4F46E5",
                     "#8E7CC3","#9B72CF","#C9485B","#B5838D","#D9803B","#E0A93C",
                     "#C2602F","#7C8079","#9AA0A6","#3F7E7A"];

  function usosDeCategoria(id) {
    return expenses.filter(function (e) { return e.categoryId === id; }).length;
  }

  // Crea un id nuevo a partir del nombre, sin acentos ni espacios, y se asegura
  // de que no choque con ninguno existente.
  function nuevoIdCategoria(label) {
    var base = sinAcentos(label).replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 24) || "categoria";
    var id = base, n = 2;
    while (CAT_MAP[id]) { id = base + "_" + n; n++; }
    return id;
  }

  // Sube o baja una categoría una posición y guarda el nuevo orden.
  function moverCategoria(catId, direccion) {
    var i = -1;
    CATS.forEach(function (c, idx) { if (c.id === catId) i = idx; });
    var j = i + direccion;
    if (i < 0 || j < 0 || j >= CATS.length) return;

    var lista = CATS.slice();
    var tmp = lista[i]; lista[i] = lista[j]; lista[j] = tmp;

    var copiaSeguridad = JSON.parse(JSON.stringify(catsPersonal));
    var tareas = [];
    lista.forEach(function (c, idx) {
      var p = catsPersonal[c.id] || {};
      if (p.orden === idx) return;                 // ya estaba en su sitio
      var nuevo = { label: p.label, emoji: p.emoji, color: p.color,
                    oculta: !!p.oculta, propia: !!p.propia, orden: idx };
      catsPersonal[c.id] = nuevo;
      tareas.push(saveCategoria({ id: c.id, label: nuevo.label, emoji: nuevo.emoji, color: nuevo.color,
                                  oculta: nuevo.oculta, propia: nuevo.propia, orden: idx }));
    });
    recalcularCategorias();
    openCategoriasSheet(); render();

    Promise.all(tareas).then(function (res) {
      if (res.every(function (r) { return r; })) return;
      catsPersonal = copiaSeguridad;
      recalcularCategorias();
      openCategoriasSheet(); render();
      avisoFallo("guardar el orden");
    });
  }

  function openCategoriasSheet() {
    var sheet = document.getElementById("sheet");
    var filas = CATS.map(function (c, idx) {
      var usos = usosDeCategoria(c.id);
      return '<div class="item" data-cat-id="' + esc(c.id) + '"' + (c.oculta ? ' style="opacity:.45"' : '') + '>' +
        '<div class="orden-btns">' +
        '<button class="orden-btn" data-subir="' + esc(c.id) + '"' + (idx === 0 ? ' disabled' : '') + ' aria-label="Subir">▲</button>' +
        '<button class="orden-btn" data-bajar="' + esc(c.id) + '"' + (idx === CATS.length - 1 ? ' disabled' : '') + ' aria-label="Bajar">▼</button>' +
        '</div>' +
        '<div class="ico" style="background:' + c.color + '22">' + c.emoji + '</div>' +
        '<div class="mid"><div class="t">' + esc(c.label) + '</div>' +
        '<div class="s">' + (usos ? usos + (usos === 1 ? " movimiento" : " movimientos") : "sin usar") +
        (c.propia ? " · propia" : "") + (c.oculta ? " · oculta" : "") + '</div></div>' +
        '<span class="chev">›</span></div>';
    }).join("");

    sheet.innerHTML =
      '<div class="grab"></div>' +
      '<h2>Categorías</h2>' +
      '<div class="cat-hint">Puedes cambiarles el nombre, el emoji y el color, ocultar las que no uses y crear otras nuevas. Ocultar una <b>no borra</b> sus movimientos: solo deja de salir al elegir categoría.</div>' +
      '<div id="catsList">' + filas + '</div>' +
      '<div class="sheet-actions"><button class="btn save-btn" id="addCatBtn" style="flex:1">+ Nueva categoría</button></div>';
    document.getElementById("modal").classList.remove("hidden");

    document.getElementById("addCatBtn").addEventListener("click", function () { openCategoriaModal(null); });
    document.getElementById("catsList").addEventListener("click", function (ev) {
      var subir = ev.target.closest("[data-subir]");
      if (subir) { ev.stopPropagation(); moverCategoria(subir.getAttribute("data-subir"), -1); return; }
      var bajar = ev.target.closest("[data-bajar]");
      if (bajar) { ev.stopPropagation(); moverCategoria(bajar.getAttribute("data-bajar"), 1); return; }
      var it = ev.target.closest("[data-cat-id]");
      if (!it) return;
      openCategoriaModal(CAT_MAP[it.getAttribute("data-cat-id")]);
    });
  }

  function openCategoriaModal(c) {
    var esNueva = !c;
    var actual = c || { id: null, label: "", emoji: "🏷️", color: COLORES_CAT[5], oculta: false, propia: true };
    var usos = esNueva ? 0 : usosDeCategoria(actual.id);
    var sePuedeBorrar = !esNueva && actual.propia && usos === 0;
    var sheet = document.getElementById("sheet");

    sheet.innerHTML =
      '<div class="grab"></div>' +
      '<h2>' + (esNueva ? "Nueva categoría" : "Editar categoría") + '</h2>' +
      (!esNueva && !actual.propia
        ? '<div class="cat-hint">Es una categoría de serie. Puedes cambiarle el nombre, el emoji y el color, u ocultarla, pero no borrarla (sus movimientos guardados dependen de ella).</div>'
        : '') +
      '<div class="field"><label>Nombre</label>' +
      '<input id="ctLabel" class="txt-input" type="text" placeholder="p. ej. Mascota" value="' + esc(actual.label) + '"></div>' +
      '<div class="field"><label>Emoji</label>' +
      '<input id="ctEmoji" class="txt-input" type="text" maxlength="4" placeholder="🏷️" value="' + esc(actual.emoji) + '" style="font-size:22px;width:88px;text-align:center"></div>' +
      '<div class="field"><label>Color</label><div id="ctColores" class="cat-grid" style="grid-template-columns:repeat(8,1fr);gap:7px">' +
      COLORES_CAT.map(function (col) {
        return '<button type="button" class="color-chip' + (col.toLowerCase() === String(actual.color).toLowerCase() ? " on" : "") + '" data-color="' + col + '" style="background:' + col + '"></button>';
      }).join("") + '</div></div>' +
      (esNueva ? '' :
        '<div class="field"><label class="check-line">' +
        '<input id="ctOculta" type="checkbox"' + (actual.oculta ? ' checked' : '') + '>' +
        '<span>Ocultarla al elegir categoría' + (usos ? ' (sus ' + usos + ' movimientos se conservan)' : '') + '</span></label></div>') +
      '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" id="ctBackBtn" style="flex:0 0 54px">‹</button>' +
      (sePuedeBorrar ? '<button class="btn del-btn" id="ctDelBtn">🗑</button>' : '') +
      '<button class="btn save-btn" id="ctSaveBtn">Guardar</button>' +
      '</div>';
    document.getElementById("modal").classList.remove("hidden");

    var colorElegido = actual.color;
    document.getElementById("ctColores").addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-color]");
      if (!b) return;
      colorElegido = b.getAttribute("data-color");
      Array.prototype.forEach.call(this.querySelectorAll(".color-chip"), function (el) {
        el.classList.toggle("on", el === b);
      });
    });

    document.getElementById("ctBackBtn").addEventListener("click", openCategoriasSheet);

    var delBtn = document.getElementById("ctDelBtn");
    if (delBtn) delBtn.addEventListener("click", function () {
      if (!window.confirm("¿Borrar la categoría \"" + actual.label + "\"?")) return;
      var copia = catsPersonal[actual.id];
      delete catsPersonal[actual.id];
      recalcularCategorias();
      openCategoriasSheet(); render();
      deleteCategoria(actual.id).then(function (ok) {
        if (ok) { toast("Categoría borrada"); return; }
        catsPersonal[actual.id] = copia;
        recalcularCategorias();
        openCategoriasSheet(); render();
        avisoFallo("borrar la categoría");
      });
    });

    document.getElementById("ctSaveBtn").addEventListener("click", function () {
      var label = document.getElementById("ctLabel").value.trim();
      if (!label) { toast("Ponle un nombre"); document.getElementById("ctLabel").focus(); return; }
      var emoji = document.getElementById("ctEmoji").value.trim() || "🏷️";
      var ocultaEl = document.getElementById("ctOculta");
      var id = esNueva ? nuevoIdCategoria(label) : actual.id;

      var antes = catsPersonal[id] ? JSON.parse(JSON.stringify(catsPersonal[id])) : null;
      // Se conserva el orden que tuviera: editar el nombre no debe recolocarla
      var ordenActual = antes && antes.orden != null ? antes.orden : null;
      catsPersonal[id] = {
        label: label, emoji: emoji, color: colorElegido,
        oculta: ocultaEl ? ocultaEl.checked : false,
        propia: esNueva ? true : !!actual.propia,
        orden: ordenActual
      };
      recalcularCategorias();
      openCategoriasSheet(); render();

      saveCategoria({ id: id, label: label, emoji: emoji, color: colorElegido,
                      oculta: ocultaEl ? ocultaEl.checked : false, propia: esNueva ? true : !!actual.propia,
                      orden: ordenActual })
        .then(function (ok) {
          if (ok) { toast(esNueva ? "Categoría creada ✓" : "Categoría actualizada ✓"); return; }
          if (antes) catsPersonal[id] = antes; else delete catsPersonal[id];
          recalcularCategorias();
          openCategoriasSheet(); render();
          avisoFallo("guardar la categoría");
        });
    });

    setTimeout(function () { var l = document.getElementById("ctLabel"); if (l && esNueva) l.focus(); }, 250);
  }

  // ---------- Cuenta / cerrar sesión ----------

    sheet.innerHTML =

  function closeModal() {
    document.getElementById("modal").classList.add("hidden");

  function saveFromModal() {
    var amt = parseAmount(document.getElementById("fAmount").value);
    if (isNaN(amt) || amt <= 0) {
      var f = document.getElementById("fAmount");
      f.focus();
      if (!document.getElementById("amtErr")) {
        var e = document.createElement("div");
        e.className = "note-err"; e.id = "amtErr"; e.style.marginTop = "6px";
        e.textContent = "Pon un importe válido.";
        f.closest(".field").appendChild(e);
      }
      return;
    }
    var note = document.getElementById("fNote").value.trim();
    var date = document.getElementById("fDate").value || todayISO();
    var selCuenta = document.getElementById("fCuenta");
    var cuenta = selCuenta ? selCuenta.value : formCuenta;
    var reemb = document.getElementById("fReemb").checked;
    var esIngreso = formKind === "ingreso";
    var catFinal = esIngreso ? "otros" : formCat; // los ingresos no usan categoría de gasto
    var palabra = esIngreso ? "Ingreso" : "Gasto";

    if (editingId) {
      var ex = expenses.find(function (x) { return x.id === editingId; });
      if (ex) {
        // Se guarda el estado anterior para poder deshacerlo si Supabase lo rechaza
        var antes = { amount: ex.amount, categoryId: ex.categoryId, note: ex.note, date: ex.date, kind: ex.kind,
                      cuenta: ex.cuenta, reembolsable: ex.reembolsable, reembolsado: ex.reembolsado };
        ex.amount = amt; ex.categoryId = catFinal; ex.note = note; ex.date = date; ex.kind = formKind; ex.cuenta = cuenta;
        ex.reembolsable = reemb;
        // Si se desmarca, deja de estar pendiente de cobro
        if (!reemb) ex.reembolsado = false;
        saveExpense(ex).then(function (ok) {
          if (ok) { toast(palabra + " actualizado ✓"); return; }
          ex.amount = antes.amount; ex.categoryId = antes.categoryId;
          ex.note = antes.note; ex.date = antes.date; ex.kind = antes.kind; ex.cuenta = antes.cuenta;
          ex.reembolsable = antes.reembolsable; ex.reembolsado = antes.reembolsado;
          render();
          avisoFallo("guardar el cambio");
        });
      }
    } else {
      var newExp = { id: uid(), amount: amt, categoryId: catFinal, note: note, date: date, kind: formKind, cuenta: cuenta,
                     reembolsable: reemb, reembolsado: false, createdAt: Date.now() };
      expenses.push(newExp);
      saveExpense(newExp).then(function (ok) {
        if (ok) { toast(palabra + " guardado ✓"); return; }
        expenses = expenses.filter(function (x) { return x.id !== newExp.id; });
        render();
        avisoFallo("guardar el " + palabra.toLowerCase());
      });
    }
    var d = new Date(date + "T00:00:00");
    viewYear = d.getFullYear(); viewMonth = d.getMonth();
    closeModal();
    render();
  }

  function deleteCurrent() {
    if (!editingId) return;
    var idToDel = editingId;
    var borrado = expenses.find(function (x) { return x.id === idToDel; });
    expenses = expenses.filter(function (x) { return x.id !== idToDel; });
    closeModal();
    render();
    deleteExpense(idToDel).then(function (ok) {
      if (ok) { toast("Movimiento eliminado"); return; }
      // No se pudo borrar en el servidor: se devuelve a la lista
      if (borrado) expenses.push(borrado);
      render();
      avisoFallo("borrar el movimiento");
    });
  }

  // ---------- Anti-duplicados ----------
  // Cuántos movimientos YA guardados coinciden en la misma fecha y el mismo importe.
  // La tolerancia es de medio céntimo: así 4,99 y 5,00 se consideran distintos
  // (antes se usaba 0,02 y los daba por iguales).
  function contarYaGuardados(fecha, importe) {
    return expenses.filter(function (e) {
      return e.date === fecha && Math.abs(e.amount - importe) < 0.005;
    }).length;
  }

  // Marca cuáles del lote que se está importando son duplicados de verdad.
  // Va contando las repeticiones dentro del propio lote: si un día hubo tres
  // cafés de 0,50 € y solo uno está guardado, el primero se marca como duplicado
  // y los otros dos entran como nuevos.
  function marcarDuplicados(lista) {
    var vistos = {};
    return lista.map(function (x) {
      var clave = x.date + "|" + x.amount.toFixed(2);
      vistos[clave] = (vistos[clave] || 0) + 1;
      return { item: x, dup: contarYaGuardados(x.date, x.amount) >= vistos[clave] };
    });
  }

  // ---------- Multi-movement review ----------
  function catOptions(selected) {
    return catsParaElegir(selected).map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === selected ? " selected" : "") + '>' + c.emoji + " " + esc(c.label) + '</option>';
    }).join("");
  }

  function openMultiReview(list) {
    editingId = null;
    var newItems = [], dupItems = [];
    marcarDuplicados(list).forEach(function (r) {
      if (r.dup) dupItems.push(r.item); else newItems.push(r.item);
    });
    var nUnclear = newItems.filter(function (x) { return x.categoryId === "sin_clasificar"; }).length;

    function buildRow(x, i, isDup) {
      var esIngreso = x.kind === "ingreso";
      var unclear = !isDup && !esIngreso && x.categoryId === "sin_clasificar";
      var cls = isDup ? " dup" : (unclear ? " unclear" : "");
      return '<div class="rev-row' + cls + '" data-i="' + i + '" data-dup="' + (isDup ? "1" : "0") + '" data-kind="' + (esIngreso ? "ingreso" : "gasto") + '"' +
        ' data-cuenta="' + esc(x.cuenta || "") + '" data-reemb="' + (x.reembolsable ? "1" : "0") + '" data-reembdo="' + (x.reembolsado ? "1" : "0") + '">' +
        (isDup
          ? '<div class="dup-badge">✓ ya guardado</div>'
          : (esIngreso
              ? '<div class="dup-badge" style="background:var(--primary-soft);color:var(--primary)">💰 Ingreso</div>'
              : (unclear ? '<div class="rev-flag">⚠ No sé de qué es — corrígelo</div>' : ''))) +
        (!isDup ? '<button class="rev-del" data-del="' + i + '">×</button>' : '') +
        '<div class="rev-top">' +
        '<input class="rev-concept" data-f="note" placeholder="¿De qué es?" value="' + esc(x.note) + '"' + (isDup ? ' readonly' : '') + '>' +
        '<input class="rev-amt" data-f="amount" inputmode="decimal" value="' + String(x.amount).replace(".", ",") + '"' + (isDup ? ' readonly' : '') + '>' +
        '</div>' +
        '<div class="rev-line2">' +
        (esIngreso
          ? '<div style="flex:1;font-size:12.5px;color:var(--muted);padding:9px 2px">Entrada de dinero (sin categoría)</div>'
          : '<select data-f="cat"' + (isDup ? ' disabled' : '') + '>' + catOptions(x.categoryId) + '</select>') +
        '<input class="rev-date" data-f="date" type="date" value="' + esc(x.date) + '"' + (isDup ? ' readonly' : '') + '>' +
        '</div>' +
        (isDup ? '<button class="force-add-btn" data-force="1">Añadir igualmente</button>' : '') +
        '</div>';
    }

    var newRows = newItems.map(function (x, i) { return buildRow(x, i, false); }).join("");
    var dupRows = dupItems.map(function (x, i) { return buildRow(x, newItems.length + i, true); }).join("");
    var dupSection = dupItems.length > 0
      ? '<div class="dup-section-head"><span>' + dupItems.length + ' ya guardado' + (dupItems.length > 1 ? 's' : '') + ' (omitidos)</span>' +
        '<button class="dup-toggle" id="dupToggle">Ver ▾</button></div>' +
        '<div id="dupList" style="display:none">' + dupRows + '</div>'
      : '';

    var countMsg = newItems.length > 0
      ? 'Detecté <b>' + newItems.length + '</b> nuevo' + (newItems.length !== 1 ? 's' : '')
      : 'Todos los movimientos ya están guardados';
    if (nUnclear) countMsg += ' · <span style="color:var(--accent)">' + nUnclear + ' sin clasificar</span>';

    var sheet = document.getElementById("sheet");
    sheet.innerHTML =
      '<div class="grab"></div>' +
      '<h2>Revisar movimientos</h2>' +
      '<div class="rev-count">' + countMsg + '</div>' +
      '<div id="revList">' + newRows + '</div>' +
      dupSection +
      '<div class="sheet-actions">' +
      (newItems.length > 0
        ? '<button class="btn save-btn" id="addAllBtn">Añadir ' + newItems.length + ' nuevo' + (newItems.length !== 1 ? 's' : '') + '</button>'
        : '<button class="btn btn-ghost" id="addAllBtn" style="flex:1" onclick="closeModal()">Cerrar</button>') +
      '</div>';

    document.getElementById("modal").classList.remove("hidden");

    document.getElementById("revList").addEventListener("click", function (ev) {
      var d = ev.target.closest("[data-del]");
      if (!d) return;
      var row = d.closest(".rev-row");
      if (row) row.parentNode.removeChild(row);
      var remaining = document.querySelectorAll("#revList .rev-row").length;
      if (remaining === 0 && dupItems.length === 0) { closeModal(); return; }
      var btn = document.getElementById("addAllBtn");
      if (btn && remaining > 0) btn.textContent = "Añadir " + remaining + " nuevo" + (remaining !== 1 ? "s" : "");
      else if (btn && remaining === 0) { btn.textContent = "Cerrar"; btn.onclick = closeModal; }
    });

    var dupToggle = document.getElementById("dupToggle");
    if (dupToggle) dupToggle.addEventListener("click", function () {
      var dl = document.getElementById("dupList");
      var open = dl.style.display !== "none";
      dl.style.display = open ? "none" : "block";
      this.textContent = open ? "Ver ▾" : "Ocultar ▴";
    });

    // Force-add desde duplicados
    var dupList = document.getElementById("dupList");
    if (dupList) dupList.addEventListener("click", function (ev) {
      var fb = ev.target.closest("[data-force]");
      if (!fb) return;
      var row = fb.closest(".rev-row");
      if (!row) return;
      row.classList.remove("dup");
      row.removeAttribute("data-dup");
      Array.prototype.forEach.call(row.querySelectorAll("input,select"), function (el) {
        el.removeAttribute("readonly"); el.removeAttribute("disabled");
      });
      fb.parentNode.removeChild(fb);
      document.getElementById("revList").appendChild(row);
      var btn = document.getElementById("addAllBtn");
      var n = document.querySelectorAll("#revList .rev-row").length;
      if (btn) btn.textContent = "Añadir " + n + " nuevo" + (n !== 1 ? "s" : "");
    });

    if (newItems.length > 0) document.getElementById("addAllBtn").addEventListener("click", addAllFromReview);
  }

  function addAllFromReview() {
    var rows = document.querySelectorAll("#revList .rev-row");
    var toSave = [], lastDate = todayISO();
    Array.prototype.forEach.call(rows, function (row) {
      if (row.getAttribute("data-dup") === "1") return;
      var amt = parseAmount(row.querySelector('[data-f="amount"]').value);
      if (isNaN(amt) || amt <= 0) return;
      var dt = row.querySelector('[data-f="date"]').value || todayISO();
      lastDate = dt;
      var esIngreso = row.getAttribute("data-kind") === "ingreso";
      var catSel = row.querySelector('[data-f="cat"]');
      var exp = {
        id: uid(), amount: amt,
        categoryId: esIngreso ? "otros" : (catSel ? catSel.value : "sin_clasificar"),
        note: row.querySelector('[data-f="note"]').value.trim(),
        date: dt, kind: esIngreso ? "ingreso" : "gasto",
        // Al importar un CSV cada fila trae su cuenta; al pegar un extracto no,
        // y entonces se usa la que se eligió para todo el lote.
        cuenta: row.getAttribute("data-cuenta") || cuentaLote,
        reembolsable: row.getAttribute("data-reemb") === "1",
        reembolsado: row.getAttribute("data-reembdo") === "1",
        createdAt: Date.now()
      };
      expenses.push(exp);
      toSave.push(exp);
    });
    if (toSave.length === 0) { toast("Revisa los importes"); return; }
    var d = new Date(lastDate + "T00:00:00");
    viewYear = d.getFullYear(); viewMonth = d.getMonth();
    closeModal(); render();
    // Se guardan todos de golpe. Si Supabase lo rechaza, se quitan de la pantalla:
    // más vale que desaparezcan y se vuelvan a pegar que creer que están guardados.
    saveExpenses(toSave).then(function (ok) {
      if (ok) {
        toast(toSave.length + (toSave.length > 1 ? " movimientos añadidos ✓" : " movimiento añadido ✓"));
        return;
      }
      var quitar = {};
      toSave.forEach(function (e) { quitar[e.id] = true; });
      expenses = expenses.filter(function (e) { return !quitar[e.id]; });
      render();
      avisoFallo("guardar los movimientos");
    });
  }

  // ---------- Paste movements (from chat) ----------
  function parsePasted(text) {
    var out = [];
    text.split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line || /^fecha\b/i.test(line)) return;
      var parts = line.split(/[;\t|]/).map(function (s) { return s.trim(); });
      // Detectar y separar el tipo (gasto/ingreso) si viene en la línea
      var kind = "gasto";
      var lc = parts.map(function (p) { return p.toLowerCase(); });
      var ki = lc.indexOf("ingreso");
      if (ki > -1) { kind = "ingreso"; parts.splice(ki, 1); }
      else { var kg = lc.indexOf("gasto"); if (kg > -1) parts.splice(kg, 1); }
      var date = null, catId = null, amount = NaN, note = "";
      if (parts.length >= 4) {
        date = parts[0]; catId = parts[1]; amount = parseAmount(parts[2]); note = parts.slice(3).join(" ");
      } else if (parts.length === 3) {
        if (/\d{4}-\d{2}-\d{2}/.test(parts[0])) { date = parts[0]; amount = parseAmount(parts[1]); note = parts[2]; }
        else { catId = parts[0]; amount = parseAmount(parts[1]); note = parts[2]; }
      } else if (parts.length === 2) {
        amount = parseAmount(parts[0]); note = parts[1];
      }
      if (isNaN(amount) || amount <= 0) {
        for (var i = 0; i < parts.length; i++) { var a = parseAmount(parts[i]); if (!isNaN(a) && a > 0) { amount = a; break; } }
      }
      if (isNaN(amount) || amount <= 0) return;
      out.push({
        amount: Math.abs(amount),
        date: (date && /\d{4}-\d{2}-\d{2}/.test(date)) ? date : todayISO(),
        note: note || "",
        kind: kind,
        categoryId: kind === "ingreso" ? "otros" : ((catId && CAT_MAP[catId]) ? catId : "sin_clasificar")
      });
    });
    return out;
  }

  function openPasteSheet() {
    editingId = null;
    var sheet = document.getElementById("sheet");
    sheet.innerHTML =
      '<div class="grab"></div>' +
      '<h2>Pegar movimientos</h2>' +
      '<div class="cat-hint">Pega aquí el listado que te paso en el chat (un gasto por línea) y pulsa Procesar. Podrás revisar todo antes de guardar.</div>' +
      // Como un extracto es siempre de un banco, se elige una vez para todo el lote
      ((perfil.cuentas && perfil.cuentas.length)
        ? '<div class="field"><label>¿De qué cuenta es este extracto?</label><select id="pasteCuenta" class="txt-input">' + cuentaOptions("") + '</select></div>'
        : '') +
      '<textarea id="pasteArea" class="txt-input" style="min-height:150px;font-family:monospace;font-size:12.5px;resize:vertical" placeholder="2026-06-04;super;23,40;Albert Heijn&#10;2026-06-03;comer;12,50;Bar Lola"></textarea>' +
      '<div id="pasteErr" class="note-err" style="margin-top:8px;display:none">No reconocí ningún gasto. Revisa el texto.</div>' +
      '<div class="sheet-actions"><button class="btn save-btn" id="procPaste">Procesar</button></div>' +
      '<div style="border-top:1px solid var(--line);margin-top:18px;padding-top:16px">' +
      '<label class="btn btn-ghost" for="csvInput" style="width:100%"><span class="ic">📄</span> Importar una copia CSV</label>' +
      '<input type="file" id="csvInput" accept=".csv,text/csv,text/plain" class="visually-hidden">' +
      '<div style="font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.45;text-align:center">Sube un CSV exportado por la app. Se revisa igual, y lo que ya tengas guardado se marca como duplicado.</div>' +
      '</div>';
    document.getElementById("modal").classList.remove("hidden");
    document.getElementById("procPaste").addEventListener("click", function () {
      var txt = document.getElementById("pasteArea").value;
      var selC = document.getElementById("pasteCuenta");
      cuentaLote = selC ? selC.value : "";
      var list = parsePasted(txt);
      if (list.length === 0) { document.getElementById("pasteErr").style.display = "block"; return; }
      if (list.length === 1) {
        var x = list[0];
        openModal({ amount: x.amount, date: x.date, note: x.note, categoryId: x.categoryId, kind: x.kind, cuenta: cuentaLote,
          statusHTML: '<div class="scan-status" style="background:var(--income-soft);color:var(--income-ink)"><div>✓ Revisa y guarda.</div></div>' });
      } else {
        openMultiReview(list);
      }
    });
    document.getElementById("csvInput").addEventListener("change", function (ev) {
      var f = ev.target.files && ev.target.files[0];
      this.value = "";
      if (!f) return;
      var lector = new FileReader();
      lector.onload = function () {
        var lista;
        try { lista = importarCSV(String(lector.result)); }
        catch (err) { console.error("importarCSV", err); lista = []; }
        if (!lista || lista.length === 0) {
          var e = document.getElementById("pasteErr");
          e.textContent = "No pude leer ese fichero. ¿Es un CSV exportado por la app?";
          e.style.display = "block";
          return;
        }
        cuentaLote = "";        // en un CSV cada fila trae ya su propia cuenta
        openMultiReview(lista);
      };
      lector.onerror = function () { toast("No se pudo leer el fichero"); };
      lector.readAsText(f, "utf-8");
    });

    setTimeout(function () { var a = document.getElementById("pasteArea"); if (a) a.focus(); }, 250);
  }

  // ---------- Importar CSV ----------
  // Lee un CSV exportado por la app (o cualquiera con cabecera parecida) y lo
  // manda a la misma pantalla de revisión que el pegado, con su antiduplicados.
  function parseCSV(texto, sep) {
    var filas = [], fila = [], campo = "", enComillas = false;
    for (var i = 0; i < texto.length; i++) {
      var ch = texto.charAt(i);
      if (enComillas) {
        if (ch === '"') {
          if (texto.charAt(i + 1) === '"') { campo += '"'; i++; }  // comilla escapada
          else enComillas = false;
        } else campo += ch;
      } else if (ch === '"') { enComillas = true; }
      else if (ch === sep) { fila.push(campo); campo = ""; }
      else if (ch === "\n") { fila.push(campo); filas.push(fila); fila = []; campo = ""; }
      else if (ch !== "\r") { campo += ch; }
    }
    if (campo !== "" || fila.length) { fila.push(campo); filas.push(fila); }
    return filas.filter(function (f) { return f.some(function (c) { return c.trim() !== ""; }); });
  }

  function importarCSV(texto) {
    if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);   // quitar BOM
    var primeraLinea = texto.split("\n")[0] || "";
    // El separador se deduce de la cabecera: si no, un importe como "23,40"
    // partiría la fila por la mitad.
    var sep = (primeraLinea.split(";").length > primeraLinea.split(",").length) ? ";" : ",";

    var filas = parseCSV(texto, sep);
    if (filas.length < 2) return [];

    var cabecera = filas[0].map(function (h) { return sinAcentos(h).replace(/[^a-z0-9]/g, ""); });
    function col(nombre) { return cabecera.indexOf(nombre); }
    var iFecha = col("fecha"), iTipo = col("tipomov"), iCatId = col("categoriaid"),
        iCat = col("categoria"), iCuenta = col("cuenta"), iNota = col("concepto"),
        iImp = col("importeeur"), iReemb = col("reembolsable"), iReembdo = col("reembolsado");
    if (iImp < 0) iImp = col("importe");
    if (iFecha < 0 || iImp < 0) return [];   // sin fecha e importe no hay nada que hacer

    // Para poder mapear categorías por su nombre visible
    var porNombre = {};
    CATS.forEach(function (c) { porNombre[sinAcentos(c.label)] = c.id; });

    var out = [];
    filas.slice(1).forEach(function (f) {
      var amt = parseAmount(f[iImp]);
      if (isNaN(amt) || amt <= 0) return;
      var fecha = (f[iFecha] || "").trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return;
      var kind = (iTipo > -1 && sinAcentos(f[iTipo]) === "ingreso") ? "ingreso" : "gasto";

      var catId = null;
      if (iCatId > -1 && f[iCatId] && CAT_MAP[f[iCatId].trim()]) catId = f[iCatId].trim();
      else if (iCat > -1 && porNombre[sinAcentos(f[iCat])]) catId = porNombre[sinAcentos(f[iCat])];

      out.push({
        amount: Math.abs(amt),
        date: fecha,
        note: iNota > -1 ? (f[iNota] || "").trim() : "",
        kind: kind,
        cuenta: iCuenta > -1 ? (f[iCuenta] || "").trim() : "",
        reembolsable: iReemb > -1 && sinAcentos(f[iReemb]) === "si",
        reembolsado: iReembdo > -1 && sinAcentos(f[iReembdo]) === "si",
        categoryId: kind === "ingreso" ? "otros" : (catId || "sin_clasificar")
      });
    });
    return out;
  }

  // ---------- CSV export ----------
  function exportCSV() {
    if (expenses.length === 0) { toast("No hay nada que exportar"); return; }
    // Se incluye CategoriaId para que la copia se pueda volver a importar aunque
    // luego cambies el nombre visible de una categoría.
    var rows = [["Fecha", "Tipo_mov", "CategoriaId", "Categoria", "Tipo", "Cuenta", "Concepto", "Importe_EUR", "Reembolsable", "Reembolsado"]];
    expenses.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (e) {
      var c = cat(e.categoryId);
      rows.push([e.date, (e.kind === "ingreso" ? "ingreso" : "gasto"), e.categoryId, c.label, c.type,
                 (e.cuenta || ""), (e.note || "").replace(/"/g, "'"), String(e.amount).replace(".", ","),
                 (e.reembolsable ? "si" : "no"), (e.reembolsado ? "si" : "no")]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (cell) { return '"' + cell + '"'; }).join(";");
    }).join("\n");
    var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "gastos_" + todayISO() + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("CSV descargado ✓");
  }

  // ---------- Toast ----------
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  // ---------- Events ----------
  function wire() {
    document.getElementById("prevMonth").addEventListener("click", function () {
      viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } render();
    });
    document.getElementById("nextMonth").addEventListener("click", function () {
      viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } render();
    });
    document.getElementById("tabResumen").addEventListener("click", function () { view = "resumen"; render(); });
    document.getElementById("tabMov").addEventListener("click", function () { view = "movimientos"; render(); });
    document.getElementById("tabEvol").addEventListener("click", function () { view = "evolucion"; render(); });
    document.getElementById("tabCal").addEventListener("click", function () { view = "calendario"; render(); });
    document.getElementById("tabDeudas").addEventListener("click", function () { view = "deudas"; render(); });
    document.getElementById("delMonthBtn").addEventListener("click", deleteMonth);
    document.getElementById("accountBtn").addEventListener("click", openAccountSheet);
    document.getElementById("addBtn").addEventListener("click", function () { openModal({}); });
    document.getElementById("pasteBtn").addEventListener("click", openPasteSheet);
    document.getElementById("fijosBtn").addEventListener("click", openFijosSheet);
    document.getElementById("presupBtn").addEventListener("click", openPresupuestosSheet);
    document.getElementById("catsBtn").addEventListener("click", openCategoriasSheet);
    document.getElementById("scrim").addEventListener("click", closeModal);
    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    // Detalle de día (Calendario): tocar un movimiento lo abre para editar. Un único escuchador, no se acumula.
    document.getElementById("sheet").addEventListener("click", function (ev) {
      var it = ev.target.closest(".item");
      if (!it) return;
      var e = expenses.find(function (x) { return x.id === it.getAttribute("data-id"); });
      if (e) openModal({ id: e.id, amount: e.amount, categoryId: e.categoryId, note: e.note, date: e.date, kind: e.kind, cuenta: e.cuenta, reembolsable: e.reembolsable });
    });
    document.getElementById("exportBtn").addEventListener("click", exportCSV);
    document.getElementById("exportBtn2").addEventListener("click", exportCSV);

    document.getElementById("content").addEventListener("click", function (ev) {
      // Marcar un gasto adelantado como ya devuelto. Va ANTES que el de deudas
      // porque comparte el estilo del botón ✓ y si no lo capturaría aquel.
      var cobradoBtn = ev.target.closest("[data-cobrado-id]");
      if (cobradoBtn) {
        ev.stopPropagation();
        var cobId = cobradoBtn.getAttribute("data-cobrado-id");
        var mov2 = expenses.find(function (x) { return x.id === cobId; });
        if (mov2) {
          mov2.reembolsado = true;
          render();
          saveExpense(mov2).then(function (ok) {
            if (ok) { toast("Marcado como devuelto ✓"); return; }
            mov2.reembolsado = false;
            render();
            avisoFallo("marcarlo como devuelto");
          });
        }
        return;
      }
      // Marcar una deuda como pagada
      var settleBtn = ev.target.closest(".debt-settle");
      if (settleBtn) {
        ev.stopPropagation();
        var sId = settleBtn.getAttribute("data-settle-id");
        var deuda = debts.find(function (x) { return x.id === sId; });
        if (deuda) {
          deuda.settled = true;
          render();
          saveDebt(deuda).then(function (ok) {
            if (ok) { toast("Marcada como pagada ✓"); return; }
            deuda.settled = false;
            render();
            avisoFallo("marcarla como pagada");
          });
        }
        return;
      }
      // Borrar una deuda
      var debtDelBtn = ev.target.closest(".debt-del");
      if (debtDelBtn) {
        ev.stopPropagation();
        var ddId = debtDelBtn.getAttribute("data-del-debt-id");
        var deuda2 = debts.find(function (x) { return x.id === ddId; });
        var etiqueta2 = deuda2 ? deuda2.persona : "esta deuda";
        if (window.confirm("¿Borrar la deuda con \"" + etiqueta2 + "\"?")) {
          debts = debts.filter(function (x) { return x.id !== ddId; });
          render();
          deleteDebt(ddId).then(function (ok) {
            if (ok) { toast("Deuda eliminada"); return; }
            if (deuda2) debts.push(deuda2);
            render();
            avisoFallo("borrar la deuda");
          });
        }
        return;
      }
      // Ajustar importe de una deuda
      var debtAdjBtn = ev.target.closest(".debt-adjust");
      if (debtAdjBtn) {
        ev.stopPropagation();
        var adjId = debtAdjBtn.getAttribute("data-adjust-id");
        var deuda3 = debts.find(function (x) { return x.id === adjId; });
        if (deuda3) openAdjustDebtModal(deuda3);
        return;
      }
      // Editar una deuda al tocarla
      var debtItem = ev.target.closest(".item[data-debt-id]");
      if (debtItem) {
        var did = debtItem.getAttribute("data-debt-id");
        var dd = debts.find(function (x) { return x.id === did; });
        if (dd) openDebtModal({ id: dd.id, persona: dd.persona, amount: dd.amount, direction: dd.direction, note: dd.note, date: dd.date });
        return;
      }
      // Botón de borrar de un movimiento (sin abrir la edición)
      var delBtn = ev.target.closest(".item-del");
      if (delBtn) {
        ev.stopPropagation();
        var delId = delBtn.getAttribute("data-del-id");
        var mov = expenses.find(function (x) { return x.id === delId; });
        var etiqueta = mov ? (mov.note || cat(mov.categoryId).label) : "este movimiento";
        if (window.confirm("¿Borrar \"" + etiqueta + "\"?")) {
          expenses = expenses.filter(function (x) { return x.id !== delId; });
          render();
          deleteExpense(delId).then(function (ok) {
            if (ok) { toast("Movimiento eliminado"); return; }
            if (mov) expenses.push(mov);
            render();
            avisoFallo("borrar el movimiento");
          });
        }
        return;
      }
      // Tocar un día del calendario
      var cell = ev.target.closest(".cal-cell");
      if (cell && !cell.classList.contains("empty")) {
        openDayDetail(cell.getAttribute("data-day"));
        return;
      }
      // Expandir/colapsar categoría
      var head = ev.target.closest(".catbar-head");
      if (head) {
        var wrap = head.closest(".catbar-wrap");
        if (wrap) {
          var cid = wrap.getAttribute("data-cat");
          openCats[cid] = !openCats[cid];
          wrap.classList.toggle("open", !!openCats[cid]);
        }
        return;
      }
      // Editar desde el detalle de categoría
      var ci = ev.target.closest(".catbar-item");
      if (ci) {
        var id = ci.getAttribute("data-id");
        var e = expenses.find(function (x) { return x.id === id; });
        if (e) openModal({ id: e.id, amount: e.amount, categoryId: e.categoryId, note: e.note, date: e.date, kind: e.kind, cuenta: e.cuenta, reembolsable: e.reembolsable });
        return;
      }
      // Editar desde la lista de movimientos
      var it = ev.target.closest(".item");
      if (!it) return;
      var id2 = it.getAttribute("data-id");
      var e2 = expenses.find(function (x) { return x.id === id2; });
      if (e2) openModal({ id: e2.id, amount: e2.amount, categoryId: e2.categoryId, note: e2.note, date: e2.date, kind: e2.kind, cuenta: e2.cuenta, reembolsable: e2.reembolsable });
    });
  }

  // ---------- Init ----------
  aplicarTema(temaGuardado());
  wire();
  initAuth();
})();
</script>
